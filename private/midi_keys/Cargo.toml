[package]
name = "midi_keys"
version = "0.1.0"
edition = "2024"
description = "MIDI keyboard input and a small synth for Vectarine games"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must match the mlua revision and features of the Vectarine release the plugin runs in
# (0.7.0 pins this commit in its Cargo.lock; Cargo.lock here keeps the same versions).
mlua = { git = "https://github.com/mlua-rs/mlua", version = "0.12.2", features = ["luau-jit", "serde", "vendored", "async"] }
midir = "0.11"
cpal = "0.18"
rtrb = "0.4"

[profile.release]
opt-level = 3
